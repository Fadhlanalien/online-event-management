<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f2f2;
    }
    .login-container {
      margin-top: 80px;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

{% with messages = get_flashed_messages() %}    <!-- Create a temporary variable named messages that stores all the flash messages (if any) sent from Flask -->

  {% if messages %}                             <!-- Check if there are any messages -->
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>                  <!-- print all the messages available in messages one by one in list-->
      {% endfor %}                              <!-- End the for loop -->
    </ul>
  {% endif %}                                   <!-- end the if condition-->
{% endwith %}                                   <!-- End the temporary with block for the messages variable. -->


<div class="container login-container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card p-4">
        <h3 class="text-center mb-4">User Login</h3>
        
        <form method="POST" action="/login">
          <div class="mb-3">
            <label for="username" class="form-label">username</label>
            <input type="username" name="username" class="form-control" id="username" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" class="form-control" id="password" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>

        <p class="mt-3 text-center">
          Don't have an account? <a href="/signup">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
