<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Edit Profile</h2>

        <form method="POST" action="/edit_profile">
            <div class="mb-3">
                <label for="name" class="form-label">username</label>
                <input type="text" class="form-control" id="name" name="username" value="{{ user_data.username }}">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ user_data.email }}">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">New Password (optional)</label>
                <input type="password" class="form-control" id="password" name="password">
            </div>

            <button type="submit" class="btn btn-primary">Update Profile</button>
            <a href="/dashboard" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>
</body>

</html>
